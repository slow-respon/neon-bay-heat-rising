<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BAY — Heat Rising</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #06030f; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #fff; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  #game { display: block; width: 100vw; height: 100vh; }
  .hud { position: absolute; pointer-events: none; text-shadow: 0 2px 6px #000; z-index: 2; }
  .hud.hidden { display: none; }
  #hud-left { top: 12px; left: 14px; font-size: 15px; line-height: 1.55; }
  #hud-left .money { font-size: 26px; font-weight: 800; color: #7dffb0; }
  #hud-left .owed { color: #ff9ecf; font-weight: 700; }
  #hud-left .goal { color: #ffe66d; font-weight: 700; max-width: 430px; }
  #hud-left .clock { color: #7df9ff; font-weight: 700; }
  #hud-right { top: 12px; right: 14px; text-align: right; }
  #stars { font-size: 26px; letter-spacing: 3px; color: #ffd23f; }
  #stars .dim { color: rgba(255,255,255,.22); }
  #minimap { width: 180px; height: 180px; margin-top: 6px; border: 2px solid rgba(255,255,255,.35);
    border-radius: 6px; background: #0a0620; box-shadow: 0 4px 18px rgba(0,0,0,.6); }
  #hud-low { bottom: 12px; left: 14px; font-size: 14px; }
  #speedo { font-size: 34px; font-weight: 800; }
  #hpbar { width: 200px; height: 10px; background: rgba(255,255,255,.2); border-radius: 5px;
    overflow: hidden; margin-top: 4px; }
  #hpfill { height: 100%; width: 100%; background: #39ff88; }
  #toast { top: 88px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 800;
    color: #ffe66d; text-align: center; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; background: rgba(5,2,18,.74); z-index: 5; }
  #screen.hidden { display: none; }
  #screen h1 { font-size: 64px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(180deg,#ff5df2,#ff2d78 45%,#ffb347);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,45,120,.55)); }
  #screen h2 { font-size: 18px; letter-spacing: 8px; color: #7df9ff; margin: 6px 0 18px; }
  #screen p { max-width: 640px; color: #ddd6ff; line-height: 1.6; font-size: 15px; }
  #screen p.story { color: #ffb3d9; font-style: italic; }
  #screen .big { font-size: 54px; font-weight: 900; letter-spacing: 3px; }
  #screen .sub { font-size: 18px; color: #ffe66d; margin-top: 10px; }
  .btn { pointer-events: auto; cursor: pointer; margin-top: 20px; padding: 13px 34px; font-size: 18px;
    font-weight: 800; letter-spacing: 2px; color: #12001f; background: linear-gradient(90deg,#ff5df2,#ffb347);
    border: none; border-radius: 999px; box-shadow: 0 6px 24px rgba(255,93,242,.5); }
  .btn:hover { transform: scale(1.04); }
  .btn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.5);
    box-shadow: none; font-size: 15px; padding: 10px 24px; }
  .pick { display: flex; gap: 12px; margin-top: 16px; }
  .pick .opt { cursor: pointer; border: 2px solid rgba(255,255,255,.35); border-radius: 10px;
    padding: 10px 18px; font-size: 14px; pointer-events: auto; }
  .pick .opt.sel { border-color: #ff5df2; background: rgba(255,93,242,.18); }
  .pick .opt b { display: block; font-size: 16px; }
  .keys { margin-top: 22px; font-size: 13px; color: #b9b3e6; line-height: 1.9; }
  .keys b { color: #fff; background: rgba(255,255,255,.14); border-radius: 4px; padding: 1px 7px; }
  .fine { margin-top: 14px; font-size: 12px; color: #8f88c9; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud-left" class="hud hidden">
    <div class="money">$<span id="cash">0</span></div>
    <div class="owed">Debt to Kingfish: $<span id="debt">5000</span></div>
    <div class="goal" id="objective"></div>
    <div class="clock" id="timer"></div>
  </div>
  <div id="hud-right" class="hud hidden">
    <div id="stars"></div>
    <canvas id="minimap" width="180" height="180"></canvas>
  </div>
  <div id="hud-low" class="hud hidden">
    <div><span id="speedo">0</span> mph <span id="veh"></span></div>
    <div id="hpbar"><div id="hpfill"></div></div>
  </div>
  <div id="toast" class="hud"></div>
  <div id="screen"></div>
</div>
<script>
"use strict";
/* NEON BAY — Heat Rising. An original open-world crime driving game.
   Every picture is drawn on canvas, every sound is synthesized WebAudio.
   No network requests, no external files, nothing borrowed from any
   commercial game. */
const cv = document.getElementById('game');
const cx = cv.getContext('2d');
const VW = 1280, VH = 720, CITY = 3200, BLOCK = 400;
const q = new URLSearchParams(location.search);
const SHOT = q.get('shot') || '';
const SEED = parseInt(q.get('seed') || '7', 10) || 7;

/* ----- small helpers ----- */
function makeRng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = makeRng(SEED);
const rr = (a, b) => a + rng() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
function angDiff(a, b) {
  let d = b - a;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

/* ----- sound: everything synthesized, no audio files ----- */
let AC = null, muted = false, engOsc = null, engGain = null, sirOsc = null, sirGain = null;
function audioInit() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    engOsc = AC.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 50;
    engGain = AC.createGain(); engGain.gain.value = 0;
    engOsc.connect(engGain); engGain.connect(AC.destination); engOsc.start();
    sirOsc = AC.createOscillator(); sirOsc.type = 'square'; sirOsc.frequency.value = 700;
    sirGain = AC.createGain(); sirGain.gain.value = 0;
    sirOsc.connect(sirGain); sirGain.connect(AC.destination); sirOsc.start();
  } catch (e) { AC = null; }
}
function tone(freq, dur, type, vol) {
  if (!AC || muted) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.15, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  } catch (e) { /* audio is best-effort */ }
}
function sfx(name) {
  if (!AC || muted) return;
  if (name === 'coin') { tone(880, 0.12, 'sine', 0.2); setTimeout(() => tone(1320, 0.18, 'sine', 0.2), 90); }
  else if (name === 'crash') tone(90, 0.25, 'sawtooth', 0.25);
  else if (name === 'busted') { tone(220, 0.4, 'square', 0.2); setTimeout(() => tone(165, 0.5, 'square', 0.2), 200); }
  else if (name === 'mission') [523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, 0.15, 'triangle', 0.2), i * 110));
  else if (name === 'horn') tone(370, 0.18, 'square', 0.12);
  else if (name === 'enter') tone(440, 0.08, 'triangle', 0.15);
}
</script>
<script>
/* ----- the city: four districts, beach and ocean, seeded layout ----- */
const ROADS = [];
for (let i = 0; i <= CITY / BLOCK; i++) ROADS.push(i * BLOCK);
const DISTRICTS = [
  { x: 0, y: 0, w: 1600, h: 1600, name: 'PALM ROW' },
  { x: 1600, y: 0, w: 1600, h: 1600, name: 'DOWNTOWN' },
  { x: 0, y: 1600, w: 1600, h: 1200, name: 'THE STRIP' },
  { x: 1600, y: 1600, w: 1600, h: 1200, name: 'MARINA' },
];
const NEON = ['#ff5df2', '#ffb347', '#7df9ff', '#7dffb0', '#ff2d78', '#ffe66d', '#9d7bff'];
const BUILDINGS = [], PALMS = [], SIGNS = [];
(function growCity() {
  for (let gx = 0; gx < CITY / BLOCK; gx++) {
    for (let gy = 0; gy < CITY / BLOCK; gy++) {
      const x0 = gx * BLOCK + 46, y0 = gy * BLOCK + 46;
      const x1 = (gx + 1) * BLOCK - 46, y1 = (gy + 1) * BLOCK - 46;
      if (y0 > 2800) continue; // the south edge is beach and ocean, no blocks
      const n = ri(1, 3);
      for (let i = 0; i < n; i++) {
        const w = rr(90, 180), h = rr(90, 180);
        BUILDINGS.push({
          x: rr(x0, x1 - w), y: rr(y0, y1 - h), w, h,
          color: pick(['#241b4d', '#2b1e5e', '#1c2b52', '#3a1c4d', '#122b3a']),
          neon: pick(NEON), winSeed: ri(1, 9999),
        });
      }
      if (rng() < 0.7) PALMS.push({ x: rr(x0, x1), y: rr(y0, y1) });
    }
  }
  for (let i = 0; i < 14; i++) {
    const b = BUILDINGS[ri(0, BUILDINGS.length - 1)];
    SIGNS.push({
      x: b.x + b.w / 2, y: b.y - 8,
      text: pick(['HOTEL', 'TACOS', '24H', 'CASINO', 'MOTEL', 'PIER', 'CLUB', 'DANCE', 'BAR', 'NEON']),
      color: pick(NEON),
    });
  }
})();
function buildingAt(x, y, pad) {
  pad = pad || 0;
  for (const b of BUILDINGS) {
    if (x > b.x - pad && x < b.x + b.w + pad && y > b.y - pad && y < b.y + b.h + pad) return b;
  }
  return null;
}
function onRoad(x, y) {
  for (const r of ROADS) if (Math.abs(x - r) < 34 || Math.abs(y - r) < 34) return true;
  return false;
}

/* ----- saved progress ----- */
const SAVE_KEY = 'neonbay-save-v1';
let save = { cash: 0, missions: 0, bestStars: 0, debt: 5000 };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (s) save = s;
} catch (e) { /* a fresh save is fine */ }
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage may be off */ }
}

/* ----- run state ----- */
const hero = { x: 1600, y: 1600, angle: -Math.PI / 2, speed: 0, onFoot: true, car: null, hp: 100, arrest: 0 };
let traffic = [], walkers = [], cops = [], sparks = [];
let wanted = 0, heat = 0, cash = save.cash, debt = 5000;
let state = 'title', mode = 'official';
let missionNo = 0, mission = null, missionClock = 0;
let elapsed = 0, quietFor = 0, copTimer = 0, camX = 1600, camY = 1600, shake = 0;
let stats = { stolen: 0, hits: 0, topSpeed: 0 };
const CAR_COLORS = ['#ff2d78', '#ffb347', '#7df9ff', '#7dffb0', '#9d7bff', '#ffe66d', '#e8e8f0', '#ff5df2'];
const STORY = [
  { name: '1 · THE PICKUP', brief: 'Pick up the package at the yellow marker. Walk or drive — just get there.',
    time: 0, pay: 400, kind: 'pickup', mx: 600, my: 600 },
  { name: '2 · THE GETAWAY', brief: 'Cops are on you. Reach the drop-off before the timer runs out!',
    time: 75, pay: 800, kind: 'getaway', mx: 2600, my: 600 },
  { name: '3 · THE PAYOFF', brief: 'Deliver the cash across Neon Bay. Stay out of the cuffs. Final run!',
    time: 90, pay: 1200, kind: 'payoff', mx: 600, my: 2400 },
];

function spawnTraffic(n) {
  for (let i = 0; i < n; i++) {
    const horiz = rng() < 0.5, r = pick(ROADS);
    traffic.push({
      x: horiz ? rr(100, CITY - 100) : r + pick([-18, 18]),
      y: horiz ? r + pick([-18, 18]) : rr(100, CITY - 100),
      angle: horiz ? (rng() < 0.5 ? 0 : Math.PI) : (rng() < 0.5 ? Math.PI / 2 : -Math.PI / 2),
      speed: rr(60, 110), color: pick(CAR_COLORS), kind: 'traffic', hp: 100, hitCd: 0,
    });
  }
}
function spawnWalkers(n) {
  for (let i = 0; i < n; i++) {
    const x = rr(80, CITY - 80), y = rr(80, 2750);
    if (onRoad(x, y) || buildingAt(x, y, 4)) { i--; continue; }
    walkers.push({ x, y, angle: rr(0, Math.PI * 2), speed: rr(28, 55), color: pick(NEON), panic: 0, tx: x, ty: y });
  }
}
function spawnCops() {
  const want = Math.min(5, Math.ceil(wanted));
  while (cops.length < want) {
    const a = rr(0, Math.PI * 2), d = rr(500, 700);
    const x = clamp(hero.x + Math.cos(a) * d, 60, CITY - 60);
    const y = clamp(hero.y + Math.sin(a) * d, 60, CITY - 60);
    cops.push({ x, y, angle: angTo(x, y, hero.x, hero.y), speed: 0, color: '#1c3fd6', kind: 'police', hp: 100, hitCd: 0 });
  }
}
function resetWorld() {
  rng = makeRng(SEED);
  traffic = []; walkers = []; cops = []; sparks = [];
  spawnTraffic(26); spawnWalkers(36);
  hero.x = 1600; hero.y = 1600; hero.angle = -Math.PI / 2; hero.speed = 0;
  hero.onFoot = true; hero.car = null; hero.hp = 100; hero.arrest = 0;
  wanted = 0; heat = 0; missionNo = 0; mission = null; elapsed = 0;
  cash = save.cash;
  debt = (typeof save.debt === 'number' ? save.debt : 5000);
  startMission(0);
}
function startMission(i) {
  missionNo = i;
  const m = STORY[i % STORY.length];
  const mx = clamp(m.mx + rr(-160, 160), 120, CITY - 120);
  const my = clamp(m.my + rr(-160, 160), 120, 2700);
  mission = { def: m, x: mx, y: my, done: false };
  missionClock = m.time;
  if (m.kind === 'getaway') { addWanted(2); spawnCops(); }
  setObjective(m.name + ' — ' + m.brief);
}
function setObjective(t) {
  const el = document.getElementById('objective');
  if (el) el.textContent = t;
}
let toastTimer = null;
function toast(t, ms) {
  const el = document.getElementById('toast');
  el.textContent = t; el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = 0; }, ms || 2600);
}
function addWanted(n) {
  heat = clamp(heat + n, 0, 6);
  const nw = Math.min(5, Math.ceil(heat));
  if (nw > wanted) {
    wanted = nw;
    save.bestStars = Math.max(save.bestStars, wanted);
    spawnCops();
    toast('WANTED LEVEL ' + wanted + ' ★', 2200);
  }
  quietFor = 0;
}
function addCash(n) {
  cash += n; save.cash = cash; persist();
  toast('+$' + n + '  •  Cash $' + cash, 2200);
  sfx('coin');
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    sparks.push({ x, y, vx: rr(-90, 90), vy: rr(-90, 90), life: rr(0.3, 0.7), color, size: rr(2, 5) });
  }
}
function wreckCar(c) {
  burst(c.x, c.y, '#ff2d78', 22); sfx('crash');
  const ti = traffic.indexOf(c); if (ti >= 0) traffic.splice(ti, 1);
  const pi = cops.indexOf(c); if (pi >= 0) cops.splice(pi, 1);
  hero.car = null; hero.onFoot = true; hero.hp = 100;
  hero.x = c.x + 40; hero.y = c.y + 40;
  toast('Car wrecked! You are on foot.', 2600);
}
</script>
<script>
/* ----- input ----- */
const keys = {};
addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if (e.repeat) return;
  keys[e.key.toLowerCase()] = true;
  audioInit();
  const k = e.key.toLowerCase();
  if (k === 'm') { muted = !muted; toast(muted ? 'Sound OFF' : 'Sound ON', 1200); }
  if (k === 'p' && (state === 'playing' || state === 'paused')) togglePause();
  if (k === 'r' && state !== 'title') startGame(mode);
  if (k === 'e' && state === 'playing') tryEnterExit();
  if (k === 'f' && state === 'playing' && hero.onFoot) punch();
  if (k === 'h' && state === 'playing' && !hero.onFoot) sfx('horn');
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

function togglePause() {
  if (state === 'playing') { state = 'paused'; showScreen(pauseHTML()); }
  else if (state === 'paused') { state = 'playing'; hideScreen(); }
}
function tryEnterExit() {
  if (hero.onFoot) {
    let best = null, bd = 70;
    for (const c of traffic) { const d = dist(hero.x, hero.y, c.x, c.y); if (d < bd) { bd = d; best = c; } }
    for (const c of cops) { const d = dist(hero.x, hero.y, c.x, c.y); if (d < bd) { bd = d; best = c; } }
    if (best) {
      hero.onFoot = false; hero.car = best;
      if (best.kind === 'traffic' || best.kind === 'police') {
        stats.stolen++;
        addWanted(1);
        toast('Car stolen! +1 ★', 2000);
      }
      sfx('enter');
    }
  } else if (hero.car) {
    const c = hero.car;
    hero.onFoot = true; hero.car = null;
    hero.x = c.x + Math.cos(c.angle + Math.PI / 2) * 36;
    hero.y = c.y + Math.sin(c.angle + Math.PI / 2) * 36;
    hero.angle = c.angle; hero.speed = 0;
  }
}
function punch() {
  for (const p of walkers) {
    if (dist(hero.x, hero.y, p.x, p.y) < 46) {
      p.panic = 3;
      p.angle = angTo(p.x, p.y, hero.x, hero.y) + Math.PI;
      addWanted(0.5);
      burst(p.x, p.y, '#ffe66d', 8);
      return;
    }
  }
  burst(hero.x + Math.cos(hero.angle) * 26, hero.y + Math.sin(hero.angle) * 26, '#ffffff', 4);
}

/* ----- simulation ----- */
function step(dt) {
  elapsed += dt;
  // Heat cools off while Maya keeps a low profile.
  quietFor += dt;
  if (wanted > 0 && quietFor > 2) {
    heat -= dt * (mode === 'official' ? 0.08 : 0.16);
    const nw = Math.max(0, Math.ceil(heat));
    if (nw < wanted) wanted = nw;
    if (heat <= 0) { wanted = 0; heat = 0; }
  }
  // Maya on foot
  if (hero.onFoot) {
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (dx || dy) {
      const l = Math.hypot(dx, dy); dx /= l; dy /= l;
      hero.angle = Math.atan2(dy, dx);
      const nx = hero.x + dx * 190 * dt, ny = hero.y + dy * 190 * dt;
      if (!buildingAt(nx, hero.y, 14)) hero.x = nx;
      if (!buildingAt(hero.x, ny, 14)) hero.y = ny;
    }
    hero.x = clamp(hero.x, 20, CITY - 20);
    hero.y = clamp(hero.y, 20, CITY - 20);
    hero.speed = 0;
  } else if (hero.car) {
    const c = hero.car;
    const fwd = (keys['w'] || keys['arrowup']) ? 1 : 0;
    const rev = (keys['s'] || keys['arrowdown']) ? 1 : 0;
    const steer = ((keys['a'] || keys['arrowleft']) ? -1 : 0) + ((keys['d'] || keys['arrowright']) ? 1 : 0);
    const drift = !!keys[' '];
    const accel = fwd ? 260 : rev ? -180 : 0;
    c.speed = clamp(c.speed + accel * dt, -140, 330);
    if (!fwd && !rev) c.speed *= Math.pow(0.4, dt);
    if (drift) c.speed *= Math.pow(0.55, dt);
    const grip = drift ? 2.1 : 3.4;
    c.angle += steer * grip * dt * Math.sign(c.speed) * Math.min(1, Math.abs(c.speed) / 120);
    const nx = c.x + Math.cos(c.angle) * c.speed * dt;
    const ny = c.y + Math.sin(c.angle) * c.speed * dt;
    if (buildingAt(nx, ny, 20)) {
      c.speed *= -0.35;
      hero.hp = Math.max(0, hero.hp - 6);
      sfx('crash'); shake = 6;
      burst(c.x, c.y, '#ffb347', 10);
      addWanted(0.25);
      if (hero.hp <= 0) wreckCar(c);
    } else { c.x = nx; c.y = ny; }
    c.x = clamp(c.x, 20, CITY - 20);
    c.y = clamp(c.y, 20, CITY - 20);
    hero.speed = c.speed; // speedometer follows the car's real speed, up and down
    stats.topSpeed = Math.max(stats.topSpeed, Math.abs(c.speed) * 0.9);
    if (Math.abs(c.speed) > 20 && Math.random() < dt * 8) {
      sparks.push({ x: c.x - Math.cos(c.angle) * 20, y: c.y - Math.sin(c.angle) * 20,
        vx: rr(-20, 20), vy: rr(-20, 20), life: 0.4, color: '#8888aa', size: 3 });
    }
    hero.x = c.x; hero.y = c.y; hero.angle = c.angle;
  }
  // Traffic drives the road grid and turns at intersections.
  for (const c of traffic) {
    if (c === hero.car) continue;
    c.x += Math.cos(c.angle) * c.speed * dt;
    c.y += Math.sin(c.angle) * c.speed * dt;
    const nearX = Math.abs(c.x - Math.round(c.x / BLOCK) * BLOCK);
    const nearY = Math.abs(c.y - Math.round(c.y / BLOCK) * BLOCK);
    if (Math.min(nearX, nearY) < 26 && rng() < dt * 0.25) c.angle += pick([-Math.PI / 2, Math.PI / 2]);
    if (c.x < 40 || c.x > CITY - 40 || c.y < 40 || c.y > CITY - 40) {
      c.angle += Math.PI;
      c.x = clamp(c.x, 60, CITY - 60);
      c.y = clamp(c.y, 60, CITY - 60);
    }
    if (c.hitCd > 0) c.hitCd -= dt;
    if (hero.car && c.hitCd <= 0 && dist(c.x, c.y, hero.car.x, hero.car.y) < 44) {
      const d = angTo(c.x, c.y, hero.car.x, hero.car.y);
      c.x -= Math.cos(d) * 30 * dt * 10;
      c.y -= Math.sin(d) * 30 * dt * 10;
      // Only fast driving is the player's fault: being rear-ended while slow
      // costs a little health, but no wanted stars.
      const atFault = Math.abs(hero.car.speed) > 60;
      hero.car.speed *= 0.82;
      hero.hp = Math.max(0, hero.hp - (atFault ? 4 : 1));
      sfx('crash'); shake = 5;
      if (atFault) { addWanted(0.5); stats.hits++; }
      c.hitCd = 1.5;
      if (hero.hp <= 0) wreckCar(hero.car);
    }
    // Traffic slows and gives way around a stopped player car.
    if (hero.car && dist(c.x, c.y, hero.car.x, hero.car.y) < 90 && Math.abs(hero.car.speed) < 30) {
      c.speed = Math.min(c.speed, 40);
    }
    for (const p of walkers) {
      if (dist(c.x, c.y, p.x, p.y) < 24) {
        p.panic = 4;
        p.angle = angTo(p.x, p.y, c.x, c.y) + Math.PI;
      }
    }
  }
  // Pedestrians wander, and flee when scared.
  for (const p of walkers) {
    if (p.panic > 0) {
      p.panic -= dt;
      p.x += Math.cos(p.angle) * 120 * dt;
      p.y += Math.sin(p.angle) * 120 * dt;
    } else {
      if (dist(p.x, p.y, p.tx, p.ty) < 12) { p.tx = p.x + rr(-160, 160); p.ty = p.y + rr(-160, 160); }
      p.angle = angTo(p.x, p.y, p.tx, p.ty);
      p.x += Math.cos(p.angle) * p.speed * dt;
      p.y += Math.sin(p.angle) * p.speed * dt;
    }
    p.x = clamp(p.x, 20, CITY - 20);
    p.y = clamp(p.y, 20, 2750);
    if (buildingAt(p.x, p.y, 6)) {
      p.x -= Math.cos(p.angle) * p.speed * dt * 2;
      p.y -= Math.sin(p.angle) * p.speed * dt * 2;
    }
    if (hero.car && dist(p.x, p.y, hero.x, hero.y) < 30) {
      p.panic = 4; addWanted(1); stats.hits++; sfx('crash'); shake = 4;
      burst(p.x, p.y, '#ff5df2', 10);
    }
    if (hero.onFoot && dist(p.x, p.y, hero.x, hero.y) < 22) p.panic = 1.5;
  }
  // Police: spawn to match the wanted level, chase Maya, ram her car,
  // and arrest her on foot if they can hold her.
  copTimer -= dt;
  if (wanted > 0 && cops.length < Math.min(5, wanted) && copTimer <= 0) { spawnCops(); copTimer = 2; }
  let touching = false;
  for (let i = cops.length - 1; i >= 0; i--) {
    const c = cops[i];
    const target = hero.car ? hero.car : { x: hero.x, y: hero.y };
    const want = angTo(c.x, c.y, target.x, target.y);
    c.angle += clamp(angDiff(c.angle, want), -2.6 * dt, 2.6 * dt);
    const top = 200 + wanted * 28;
    c.speed = clamp(c.speed + 220 * dt, 0, top);
    c.x += Math.cos(c.angle) * c.speed * dt;
    c.y += Math.sin(c.angle) * c.speed * dt;
    if (buildingAt(c.x, c.y, 20)) c.speed *= -0.3;
    const d = dist(c.x, c.y, hero.x, hero.y);
    if (d < 40) {
      touching = true;
      if (hero.car) {
        hero.car.speed *= 0.9;
        hero.hp = Math.max(0, hero.hp - 5);
        shake = 5; sfx('crash');
        if (hero.hp <= 0) wreckCar(hero.car);
      } else {
        hero.arrest += dt;
        if (hero.arrest > 1.1) { endGame('busted'); return; }
      }
    }
    if (d > 1100) cops.splice(i, 1);
  }
  // The arrest meter only cools down when no cop is holding Maya at all.
  if (!touching && hero.onFoot) hero.arrest = Math.max(0, hero.arrest - dt);
  if (wanted === 0 && cops.length > 0 && rng() < dt * 0.3) cops.pop();
  // Missions: reach the marker; timed ones fail and restart on timeout.
  if (mission && !mission.done) {
    if (missionClock > 0) {
      missionClock -= dt;
      if (missionClock <= 0) {
        toast('Too slow! Mission failed — try again.', 2600);
        startMission(missionNo);
      }
    }
    if (dist(hero.x, hero.y, mission.x, mission.y) < 56) {
      mission.done = true;
      const pay = mission.def.pay;
      addCash(pay);
      save.missions++;
      debt = Math.max(0, debt - pay);
      save.debt = debt; persist();
      if (missionNo >= 2) { // the Payoff clears the whole remaining debt
        debt = 0; save.debt = 0; persist();
        endGame('win'); return;
      }
      toast('Mission complete! +$' + pay, 2600);
      startMission((missionNo + 1) % STORY.length);
    }
  }
  // Particles
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) sparks.splice(i, 1);
  }
  // Camera follows Maya, with a little shake after impacts.
  camX += (hero.x - camX) * Math.min(1, dt * 5);
  camY += (hero.y - camY) * Math.min(1, dt * 5);
  if (shake > 0) shake = Math.max(0, shake - dt * 22);
  // Engine and siren hums follow the action.
  if (AC && !muted) {
    if (engGain) engGain.gain.value = hero.car ? 0.03 + (Math.abs(hero.speed) / 330) * 0.05 : 0;
    if (engOsc) engOsc.frequency.value = 50 + Math.abs(hero.speed || 0) * 0.45;
    if (sirGain) sirGain.gain.value = wanted >= 2 ? 0.02 : 0;
    if (sirOsc) sirOsc.frequency.value = 650 + Math.sin(elapsed * 6) * 180;
  }
}
</script>
<script>
/* ----- rendering ----- */
const mm = document.getElementById('minimap').getContext('2d');
function rrPath(x, y, w, h, r) {
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.arcTo(x + w, y, x + w, y + h, r);
  cx.arcTo(x + w, y + h, x, y + h, r);
  cx.arcTo(x, y + h, x, y, r);
  cx.arcTo(x, y, x + w, y, r);
  cx.closePath();
}
function drawCar(c, isPlayer) {
  cx.save();
  cx.translate(c.x, c.y);
  cx.rotate(c.angle);
  cx.shadowColor = c.kind === 'police' ? '#ff2222' : c.color;
  cx.shadowBlur = isPlayer ? 16 : 8;
  cx.fillStyle = '#000';
  cx.fillRect(-24, -13, 48, 26);
  cx.shadowBlur = 0;
  cx.fillStyle = c.color;
  rrPath(-22, -11, 44, 22, 6); cx.fill();
  cx.fillStyle = 'rgba(180,230,255,.9)';
  rrPath(-6, -10, 14, 20, 3); cx.fill();
  cx.fillStyle = '#111'; cx.fillRect(14, -9, 5, 18);
  cx.fillStyle = '#ffe66d'; cx.fillRect(20, -9, 3, 5); cx.fillRect(20, 4, 3, 5);
  cx.fillStyle = '#ff2222'; cx.fillRect(-23, -9, 3, 5); cx.fillRect(-23, 4, 3, 5);
  if (c.kind === 'police') {
    cx.fillStyle = (Math.floor(elapsed * 6) % 2 === 0) ? '#ff2222' : '#2244ff';
    cx.fillRect(-8, -11, 16, 5);
    cx.fillStyle = '#fff'; cx.font = 'bold 9px sans-serif'; cx.textAlign = 'center';
    cx.fillText('PD', 0, 2);
  }
  cx.restore();
}
function render() {
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  const ox = clamp(camX - VW / 2, 0, CITY - VW), oy = clamp(camY - VH / 2, 0, CITY - VH);
  cx.save();
  cx.translate(-ox + sx, -oy + sy);
  // Ground and ocean
  cx.fillStyle = '#0d0a24'; cx.fillRect(ox - 20, oy - 20, VW + 40, VH + 40);
  cx.fillStyle = '#062a4d'; cx.fillRect(ox - 20, 2820, VW + 40, CITY - 2820 + 40);
  cx.fillStyle = '#0a4a7a';
  for (let i = 0; i < 24; i++) {
    const wx = (i * 137 + elapsed * 22) % CITY;
    cx.fillRect(wx, 2860 + ((i * 53) % 120), 90, 3);
  }
  cx.fillStyle = '#e8c98a'; cx.fillRect(ox - 20, 2760, VW + 40, 60); // sand
  // City blocks
  cx.fillStyle = '#14102e';
  for (let bx = 0; bx < CITY / BLOCK; bx++) {
    for (let by = 0; by < CITY / BLOCK; by++) {
      if (by * BLOCK > 2760) continue;
      cx.fillRect(bx * BLOCK + 34, by * BLOCK + 34, BLOCK - 68, BLOCK - 68);
    }
  }
  // Roads with dashed centre lines
  cx.fillStyle = '#1d1d2e';
  for (const r of ROADS) {
    cx.fillRect(r - 34, oy - 20, 68, VH + 40);
    cx.fillRect(ox - 20, r - 34, VW + 40, 68);
  }
  cx.strokeStyle = 'rgba(255,214,64,.55)'; cx.lineWidth = 2; cx.setLineDash([18, 18]);
  for (const r of ROADS) {
    cx.beginPath(); cx.moveTo(r, oy - 20); cx.lineTo(r, oy + VH + 20); cx.stroke();
    cx.beginPath(); cx.moveTo(ox - 20, r); cx.lineTo(ox + VW + 20, r); cx.stroke();
  }
  cx.setLineDash([]);
  // District names, faint on the ground
  cx.font = 'bold 44px sans-serif'; cx.textAlign = 'left'; cx.fillStyle = 'rgba(255,255,255,.06)';
  for (const d of DISTRICTS) cx.fillText(d.name, d.x + 90, d.y + 220);
  // Palm trees
  for (const p of PALMS) {
    cx.strokeStyle = '#2fae5f'; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x + 4, p.y - 14); cx.stroke();
    cx.fillStyle = '#39d67a';
    cx.beginPath(); cx.arc(p.x + 4, p.y - 16, 8, 0, 7); cx.fill();
  }
  // Buildings: neon roof edge and lit windows
  for (const b of BUILDINGS) {
    cx.fillStyle = '#000'; cx.fillRect(b.x + 4, b.y + 6, b.w, b.h);
    cx.fillStyle = b.color; cx.fillRect(b.x, b.y, b.w, b.h);
    cx.fillStyle = b.neon; cx.globalAlpha = 0.9; cx.fillRect(b.x, b.y, b.w, 4); cx.globalAlpha = 1;
    const wr = makeRng(b.winSeed);
    cx.fillStyle = 'rgba(255,230,120,.85)';
    for (let wy = b.y + 12; wy < b.y + b.h - 10; wy += 18) {
      for (let wx = b.x + 10; wx < b.x + b.w - 10; wx += 16) {
        if (wr() < 0.4) cx.fillRect(wx, wy, 8, 10);
      }
    }
  }
  for (const s of SIGNS) {
    cx.font = 'bold 15px sans-serif'; cx.textAlign = 'center';
    cx.shadowColor = s.color; cx.shadowBlur = 12; cx.fillStyle = s.color;
    cx.fillText(s.text, s.x, s.y);
    cx.shadowBlur = 0;
  }
  // Mission marker, with an arrow when it is off-screen
  if (mission && !mission.done) {
    const pulse = 1 + Math.sin(elapsed * 5) * 0.15;
    cx.save();
    cx.translate(mission.x, mission.y); cx.scale(pulse, pulse);
    cx.strokeStyle = '#ffe66d'; cx.lineWidth = 4; cx.shadowColor = '#ffe66d'; cx.shadowBlur = 16;
    cx.beginPath(); cx.arc(0, 0, 30, 0, 7); cx.stroke();
    cx.fillStyle = '#ffe66d';
    cx.beginPath(); cx.moveTo(0, 14); cx.lineTo(-10, -6); cx.lineTo(10, -6); cx.closePath(); cx.fill();
    cx.restore();
    cx.shadowBlur = 0;
    const dx = mission.x - hero.x, dy = mission.y - hero.y, d = Math.hypot(dx, dy);
    if (d > 420) {
      const ax = hero.x + (dx / d) * 300, ay = hero.y + (dy / d) * 300;
      cx.save();
      cx.translate(ax, ay); cx.rotate(Math.atan2(dy, dx));
      cx.fillStyle = '#ffe66d';
      cx.beginPath(); cx.moveTo(14, 0); cx.lineTo(-8, -10); cx.lineTo(-8, 10); cx.closePath(); cx.fill();
      cx.restore();
    }
  }
  // Pedestrians
  for (const p of walkers) {
    cx.fillStyle = p.color;
    cx.beginPath(); cx.arc(p.x, p.y, 6, 0, 7); cx.fill();
    cx.fillStyle = '#ffd9b0';
    cx.beginPath(); cx.arc(p.x, p.y - 3, 3.4, 0, 7); cx.fill();
  }
  // Cars and police
  for (const c of traffic) drawCar(c, c === hero.car);
  for (const c of cops) drawCar(c, false);
  // Maya on foot
  if (hero.onFoot) {
    cx.save();
    cx.translate(hero.x, hero.y); cx.rotate(hero.angle);
    cx.shadowColor = '#7df9ff'; cx.shadowBlur = 10;
    cx.fillStyle = '#7df9ff';
    cx.beginPath(); cx.arc(0, 0, 9, 0, 7); cx.fill();
    cx.shadowBlur = 0; cx.fillStyle = '#12001f';
    cx.beginPath(); cx.arc(4, 0, 4, 0, 7); cx.fill();
    cx.restore();
  }
  // Particles
  for (const p of sparks) {
    cx.globalAlpha = Math.max(0, p.life * 2);
    cx.fillStyle = p.color;
    cx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  cx.globalAlpha = 1;
  cx.restore();
  // Vignette to frame the scene
  const g = cx.createRadialGradient(VW / 2, VH / 2, VH * 0.35, VW / 2, VH / 2, VH * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(10,2,30,.55)');
  cx.fillStyle = g; cx.fillRect(0, 0, VW, VH);
  drawMinimap();
}
function drawMinimap() {
  mm.fillStyle = '#0a0620'; mm.fillRect(0, 0, 180, 180);
  const s = 180 / CITY;
  mm.fillStyle = '#2a2a44';
  for (const r of ROADS) { mm.fillRect(r * s - 1, 0, 2, 180); mm.fillRect(0, r * s - 1, 180, 2); }
  mm.fillStyle = '#0a4a7a'; mm.fillRect(0, 2820 * s, 180, 180 - 2820 * s);
  if (mission && !mission.done) {
    mm.fillStyle = '#ffe66d';
    mm.beginPath(); mm.arc(mission.x * s, mission.y * s, 5, 0, 7); mm.fill();
  }
  mm.fillStyle = '#ff2222';
  for (const c of cops) { mm.beginPath(); mm.arc(c.x * s, c.y * s, 3, 0, 7); mm.fill(); }
  mm.fillStyle = '#7df9ff';
  mm.beginPath(); mm.arc(hero.x * s, hero.y * s, 4, 0, 7); mm.fill();
  mm.strokeStyle = '#fff'; mm.lineWidth = 1.5;
  mm.beginPath(); mm.arc(hero.x * s, hero.y * s, 6, 0, 7); mm.stroke();
}
</script>
<script>
/* ----- HUD and screens ----- */
const screenEl = document.getElementById('screen');
function showScreen(html) { screenEl.innerHTML = html; screenEl.classList.remove('hidden'); }
function hideScreen() { screenEl.classList.add('hidden'); screenEl.innerHTML = ''; }
function titleHTML() {
  const cont = save.cash > 0 || save.missions > 0;
  return '<h1>NEON BAY</h1><h2>HEAT RISING</h2>' +
    '<p class="story">Maya Solis, getaway driver. You owe Kingfish $5,000 — and the whole city is watching. ' +
    'Run his jobs, dodge the Neon Bay PD, and pay the debt before the heat burns you.</p>' +
    '<p style="margin-top:10px">Open-world driving • wanted stars • police chases • 3 story missions • minimap • save</p>' +
    '<div class="pick"><div class="opt sel" id="mA"><b>OFFICIAL</b>Strict police, slow heat decay</div>' +
    '<div class="opt" id="mB"><b>FAN EDITION</b>Relaxed police, faster decay</div></div>' +
    '<button class="btn" id="startBtn">' + (cont ? 'CONTINUE — $' + save.cash : 'START ENGINE') + '</button>' +
    (cont ? '<button class="btn ghost" id="newBtn">New game</button>' : '') +
    '<div class="keys"><b>W A S D</b> drive / walk &nbsp; <b>E</b> enter / exit car &nbsp; <b>Space</b> handbrake &nbsp; ' +
    '<b>F</b> punch &nbsp; <b>H</b> horn &nbsp; <b>P</b> pause &nbsp; <b>R</b> restart &nbsp; <b>M</b> sound</div>' +
    '<p class="fine">Original game — no assets, names or music from any commercial game. All art drawn in code, all sound synthesized.</p>';
}
function pauseHTML() {
  return '<div class="big" style="font-size:44px">PAUSED</div>' +
    '<p>Cash $' + cash + ' • Missions done: ' + save.missions + ' • Top speed ' + Math.round(stats.topSpeed) + ' mph</p>' +
    '<button class="btn" onclick="resumeGame()">RESUME</button>' +
    '<button class="btn ghost" onclick="startGame(mode)">RESTART RUN</button>';
}
function endHTML(kind) {
  if (kind === 'win') {
    return '<div class="big">DEBT PAID!</div>' +
      '<p class="sub">Maya walks away clean. Neon Bay is yours — free roam continues.</p>' +
      '<p>Cash $' + cash + ' • Missions completed: ' + save.missions + '</p>' +
      '<button class="btn" onclick="resumeGame()">KEEP DRIVING</button>';
  }
  if (kind === 'busted') {
    return '<div class="big" style="color:#7df9ff">BUSTED!</div>' +
      '<p class="sub">The Neon Bay PD finally got you. The debt is still waiting…</p>' +
      '<p>Cash kept: $' + cash + '</p>' +
      '<button class="btn" onclick="startGame(mode)">TRY AGAIN</button>';
  }
  return '<div class="big" style="color:#ff5df2">WRECKED!</div>' +
    '<p>Cash kept: $' + cash + '</p>' +
    '<button class="btn" onclick="startGame(mode)">TRY AGAIN</button>';
}
function updateHUD() {
  document.getElementById('cash').textContent = cash;
  document.getElementById('debt').textContent = Math.max(0, debt);
  document.getElementById('speedo').textContent = Math.round(Math.abs(hero.speed || 0));
  document.getElementById('veh').textContent =
    hero.onFoot ? ' · ON FOOT' : (hero.car && hero.car.kind === 'police' ? ' · STOLEN PD CRUISER' : ' · DRIVING');
  const hf = document.getElementById('hpfill');
  hf.style.width = hero.hp + '%';
  hf.style.background = hero.hp > 50 ? '#39ff88' : hero.hp > 25 ? '#ffb347' : '#ff2d78';
  let stars = '';
  for (let i = 1; i <= 5; i++) stars += i <= wanted ? '★' : '<span class="dim">★</span>';
  document.getElementById('stars').innerHTML = stars;
  const mt = document.getElementById('timer');
  mt.textContent = (mission && missionClock > 0) ? ('⏱ ' + Math.ceil(missionClock) + 's — reach the marker!') : '';
}
function showHUD(v) {
  for (const id of ['hud-left', 'hud-right', 'hud-low']) {
    document.getElementById(id).classList.toggle('hidden', !v);
  }
}
</script>
<script>
/* ----- game flow ----- */
function startGame(m) {
  mode = m || mode;
  audioInit();
  resetWorld();
  state = 'playing';
  hideScreen(); showHUD(true);
  setObjective(STORY[0].name + ' — ' + STORY[0].brief);
  toast('Neon Bay — pay the $' + debt + ' debt. Good luck, Maya.', 3000);
}
function resumeGame() { state = 'playing'; hideScreen(); }
function endGame(kind) {
  state = kind;
  sfx('busted');
  showScreen(endHTML(kind));
}
window.resumeGame = resumeGame;
window.startGame = startGame;
screenEl.addEventListener('click', (e) => {
  if (e.target.id === 'startBtn') startGame(mode);
  if (e.target.id === 'newBtn') {
    save = { cash: 0, missions: 0, bestStars: 0, debt: 5000 };
    persist();
    startGame(mode);
  }
  if (e.target.id === 'mA' || (e.target.closest && e.target.closest('#mA'))) {
    mode = 'official';
    document.getElementById('mA').classList.add('sel');
    document.getElementById('mB').classList.remove('sel');
  }
  if (e.target.id === 'mB' || (e.target.closest && e.target.closest('#mB'))) {
    mode = 'fan';
    document.getElementById('mB').classList.add('sel');
    document.getElementById('mA').classList.remove('sel');
  }
});

/* ----- screenshot scenes: real renders of the game itself ----- */
function applyShot() {
  if (SHOT === 'start') {
    resetWorld(); state = 'title';
    showScreen(titleHTML()); showHUD(false);
    return;
  }
  if (SHOT === 'play') {
    resetWorld(); state = 'playing';
    hideScreen(); showHUD(true);
    // Maya mid-chase in a stolen car: 3 wanted stars, police closing in,
    // first mission live on the HUD and minimap.
    const c = traffic[0];
    c.x = 1600; c.y = 1600; c.angle = -Math.PI / 2; c.speed = 180;
    hero.onFoot = false; hero.car = c; hero.x = 1600; hero.y = 1600;
    camX = 1600; camY = 1600;
    addWanted(3); spawnCops();
    keys['w'] = true; // hold the gas while the scene settles, so the shot shows a fast chase
    for (let i = 0; i < 40; i++) step(1 / 60); // let traffic and police settle into a lively frame
    keys['w'] = false;
    return;
  }
  if (SHOT === 'end') {
    resetWorld();
    cash = 5000; save.cash = 5000; debt = 0;
    state = 'win';
    showScreen(endHTML('win')); showHUD(false);
    return;
  }
}

/* ----- main loop ----- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === 'playing') { step(dt); updateHUD(); }
  render();
  requestAnimationFrame(loop);
}
/* Debug hook for local playtesting (harmless in production). */
window.__neonbay = {
  startGame, endGame, addWanted, step,
  get state() { return state; },
  player: hero,
  get wanted() { return wanted; },
  get heat() { return heat; },
  get cash() { return cash; },
  get debt() { return debt; },
  get mission() { return mission; },
  get missionNo() { return missionNo; },
  get cars() { return traffic; },
  get peds() { return walkers; },
  get police() { return cops; },
};

if (SHOT) applyShot();
else { resetWorld(); state = 'title'; showScreen(titleHTML()); showHUD(false); }
requestAnimationFrame(loop);
</script>
