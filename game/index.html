<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BAY — Heat Rising</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #070312; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #fff; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  #game { display: block; width: 100vw; height: 100vh; }
  #minimap { width: 180px; height: 180px; }
  .hud { position: absolute; pointer-events: none; text-shadow: 0 2px 6px #000; }
  #hudTop { top: 12px; left: 14px; font-size: 15px; line-height: 1.5; }
  #hudTop .cash { font-size: 24px; font-weight: 800; color: #7dffb0; }
  #hudTop .debt { color: #ff9ecf; font-weight: 700; }
  #hudTop .obj { color: #ffe66d; font-weight: 700; max-width: 420px; }
  #hudRight { top: 12px; right: 14px; text-align: right; }
  #stars { font-size: 26px; letter-spacing: 3px; color: #ffd23f; }
  #stars .off { color: rgba(255,255,255,.22); }
  #minimap { margin-top: 6px; border: 2px solid rgba(255,255,255,.35); border-radius: 6px;
    background: #0a0620; box-shadow: 0 4px 18px rgba(0,0,0,.6); }
  #hudBottom { bottom: 12px; left: 14px; font-size: 14px; }
  #speed { font-size: 34px; font-weight: 800; color: #fff; }
  #healthbar { width: 200px; height: 10px; background: rgba(255,255,255,.2);
    border-radius: 5px; overflow: hidden; margin-top: 4px; }
  #healthfill { height: 100%; width: 100%; background: #39ff88; }
  #toast { top: 84px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 800;
    color: #ffe66d; text-align: center; opacity: 0; transition: opacity .3s; }
  #screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; background: rgba(5,2,18,.72);
    pointer-events: auto; z-index: 5; }
  #screen h1 { font-size: 64px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(180deg,#ff5df2,#ff2d78 45%,#ffb347);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,45,120,.55)); }
  #screen h2 { font-size: 18px; letter-spacing: 8px; color: #7df9ff; margin: 6px 0 18px; }
  #screen p { max-width: 620px; color: #ddd6ff; line-height: 1.6; font-size: 15px; }
  #screen .story { color: #ffb3d9; font-style: italic; }
  .btn { pointer-events: auto; cursor: pointer; margin-top: 20px; padding: 13px 34px; font-size: 18px;
    font-weight: 800; letter-spacing: 2px; color: #12001f; background: linear-gradient(90deg,#ff5df2,#ffb347);
    border: none; border-radius: 999px; box-shadow: 0 6px 24px rgba(255,93,242,.5); }
  .btn:hover { transform: scale(1.04); }
  .btn.ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.5);
    box-shadow: none; font-size: 15px; padding: 10px 24px; }
  .keys { margin-top: 22px; font-size: 13px; color: #b9b3e6; line-height: 1.9; }
  .keys b { color: #fff; background: rgba(255,255,255,.14); border-radius: 4px; padding: 1px 7px; }
  .modes { display: flex; gap: 12px; margin-top: 16px; }
  .mode { cursor: pointer; border: 2px solid rgba(255,255,255,.35); border-radius: 10px;
    padding: 10px 18px; font-size: 14px; pointer-events: auto; }
  .mode.sel { border-color: #ff5df2; background: rgba(255,93,242,.18); }
  .mode b { display: block; font-size: 16px; }
  #screen.hidden, .hud.hidden { display: none; }
  #big { font-size: 54px; font-weight: 900; letter-spacing: 3px; }
  #sub { font-size: 18px; color: #ffe66d; margin-top: 10px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hudTop" class="hud hidden">
    <div class="cash">$<span id="cash">0</span></div>
    <div class="debt">Debt to Kingfish: $<span id="debt">5000</span></div>
    <div class="obj" id="objective"></div>
    <div id="missionTimer"></div>
  </div>
  <div id="hudRight" class="hud hidden">
    <div id="stars"></div>
    <canvas id="minimap" width="180" height="180"></canvas>
  </div>
  <div id="hudBottom" class="hud hidden">
    <div><span id="speed">0</span> mph <span id="vehState"></span></div>
    <div id="healthbar"><div id="healthfill"></div></div>
  </div>
  <div id="toast" class="hud"></div>
  <div id="screen"></div>
</div>
<script>
"use strict";
/* NEON BAY — Heat Rising. Original open-world crime driving game.
   All art is drawn on canvas, all sound is synthesized WebAudio.
   No external requests, no external assets. */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = 1280, H = 720, WORLD = 3200, ROAD = 400;
const params = new URLSearchParams(location.search);
const SHOT = params.get('shot') || '';
const SEED = parseInt(params.get('seed') || '7', 10) || 7;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rng = mulberry32(SEED);
function rr(a,b){return a+rng()*(b-a);}
function ri(a,b){return Math.floor(rr(a,b+1));}
function pick(arr){return arr[Math.floor(rng()*arr.length)];}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by);}
function angTo(ax,ay,bx,by){return Math.atan2(by-ay,bx-ax);}
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}

/* ---------- audio (synthesized, no files) ---------- */
let AC=null, muted=false, engineOsc=null, engineGain=null, sirenOsc=null, sirenGain=null;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    engineOsc = AC.createOscillator(); engineOsc.type='sawtooth'; engineOsc.frequency.value=50;
    engineGain = AC.createGain(); engineGain.gain.value=0;
    engineOsc.connect(engineGain); engineGain.connect(AC.destination); engineOsc.start();
    sirenOsc = AC.createOscillator(); sirenOsc.type='square'; sirenOsc.frequency.value=700;
    sirenGain = AC.createGain(); sirenGain.gain.value=0;
    sirenOsc.connect(sirenGain); sirenGain.connect(AC.destination); sirenOsc.start();
  }catch(e){ AC=null; }
}
function beep(freq,dur,type,vol){
  if(!AC||muted) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.15, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
function sfx(name){
  if(!AC||muted) return;
  if(name==='coin'){ beep(880,0.12,'sine',0.2); setTimeout(()=>beep(1320,0.18,'sine',0.2),90); }
  else if(name==='crash'){ beep(90,0.25,'sawtooth',0.25); }
  else if(name==='busted'){ beep(220,0.4,'square',0.2); setTimeout(()=>beep(165,0.5,'square',0.2),200); }
  else if(name==='mission'){ [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'triangle',0.2),i*110)); }
  else if(name==='horn'){ beep(370,0.18,'square',0.12); }
  else if(name==='enter'){ beep(440,0.08,'triangle',0.15); }
}

/* ---------- city generation (seeded, deterministic) ---------- */
const ROADS=[]; for(let i=0;i<=WORLD/ROAD;i++) ROADS.push(i*ROAD);
const BUILDINGS=[], PALMS=[], NEON_SIGNS=[];
const DISTRICTS=[
  {x:0,y:0,w:1600,h:1600,name:'PALM ROW',hue:280},
  {x:1600,y:0,w:1600,h:1600,name:'DOWNTOWN',hue:200},
  {x:0,y:1600,w:1600,h:1200,name:'THE STRIP',hue:320},
  {x:1600,y:1600,w:1600,h:1200,name:'MARINA',hue:180},
];
const PALETTE=['#ff5df2','#ffb347','#7df9ff','#7dffb0','#ff2d78','#ffe66d','#9d7bff'];
(function buildCity(){
  for(let bx=0; bx<WORLD/ROAD; bx++){
    for(let by=0; by<WORLD/ROAD; by++){
      const x0=bx*ROAD+46, y0=by*ROAD+46, x1=(bx+1)*ROAD-46, y1=(by+1)*ROAD-46;
      if(y0>2800) continue; // beach / ocean strip at the south edge
      const n=ri(1,3);
      for(let i=0;i<n;i++){
        const w=rr(90,180), h=rr(90,180);
        const x=rr(x0,x1-w), y=rr(y0,y1-h);
        BUILDINGS.push({x,y,w,h,hgt:rr(30,120),color:pick(['#241b4d','#2b1e5e','#1c2b52','#3a1c4d','#122b3a']),
          neon:pick(PALETTE), winSeed:ri(1,9999)});
      }
      if(rng()<0.7) PALMS.push({x:rr(x0,x1),y:rr(y0,y1)});
    }
  }
  for(let i=0;i<14;i++){
    const b=BUILDINGS[ri(0,BUILDINGS.length-1)];
    NEON_SIGNS.push({x:b.x+b.w/2,y:b.y-8,text:pick(['HOTEL','TACOS','24H','CASINO','MOTEL','PIER','CLUB','DANCE','BAR','NEON']),color:pick(PALETTE)});
  }
})();
function inBuilding(x,y,pad){
  pad=pad||0;
  for(const b of BUILDINGS) if(x>b.x-pad&&x<b.x+b.w+pad&&y>b.y-pad&&y<b.y+b.h+pad) return b;
  return null;
}
function onRoad(x,y){
  for(const r of ROADS){ if(Math.abs(x-r)<34||Math.abs(y-r)<34) return true; }
  return false;
}
function nearestRoadPoint(x,y){
  let bx=ROADS[0],by=ROADS[0],bd=1e9;
  for(const r of ROADS){ const d=Math.abs(x-r); if(d<bd){bd=d;bx=r;} }
  bd=1e9;
  for(const r of ROADS){ const d=Math.abs(y-r); if(d<bd){bd=d;by=r;} }
  return {x:bx,y:by};
}

/* ---------- state ---------- */
const SAVE_KEY='neonbay-save-v1';
let save={cash:0,missions:0,bestStars:0,debt:5000};
try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); if(s) save=s; }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

const player={x:1600,y:1600,angle:-Math.PI/2,speed:0,onFoot:true,car:null,health:100,arrest:0};
let cars=[], peds=[], police=[], parts=[], pickups=[];
let wanted=0, heat=0, cash=save.cash, debt=5000; // resetWorld() recomputes debt from completed missions
let state='title', mode='official', missionIndex=0, mission=null, missionTimer=0,
    elapsed=0, chaosTimer=0, spawnTimer=0, camX=1600, camY=1600, shake=0;
let stats={stolen:0,hits:0,topSpeed:0}; // debt is set in resetWorld(): 5000 minus 1200 per completed mission
const MISSIONS=[
  {name:'1 · THE PICKUP', text:'Pick up the package at the yellow marker. Walk or drive — just get there.',
   time:0, reward:400, setup:'pickup'},
  {name:'2 · THE GETAWAY', text:'Cops are on you. Reach the drop-off before the timer runs out!',
   time:75, reward:800, setup:'getaway'},
  {name:'3 · THE PAYOFF', text:'Deliver the cash across Neon Bay. Stay out of the cuffs. Final run!',
   time:90, reward:1200, setup:'payoff'},
];
const CAR_COLORS=['#ff2d78','#ffb347','#7df9ff','#7dffb0','#9d7bff','#ffe66d','#e8e8f0','#ff5df2'];

function spawnTraffic(n){
  for(let i=0;i<n;i++){
    const horiz=rng()<0.5, r=pick(ROADS);
    cars.push({x:horiz?rr(100,WORLD-100):r+pick([-18,18]), y:horiz?r+pick([-18,18]):rr(100,WORLD-100),
      angle:horiz?(rng()<0.5?0:Math.PI):(rng()<0.5?Math.PI/2:-Math.PI/2),
      speed:rr(60,110), color:pick(CAR_COLORS), kind:'traffic', health:100, w:44, h:22});
  }
}
function spawnPeds(n){
  for(let i=0;i<n;i++){
    const x=rr(80,WORLD-80), y=rr(80,Math.min(WORLD-80,2750));
    if(onRoad(x,y)||inBuilding(x,y,4)){ i--; continue; }
    peds.push({x,y,angle:rr(0,Math.PI*2),speed:rr(28,55),color:pick(PALETTE),panic:0,tx:x,ty:y});
  }
}
function spawnPolice(){
  const want=Math.min(5,Math.ceil(wanted));
  while(police.length<want){
    const a=rr(0,Math.PI*2), d=rr(500,700);
    const x=clamp(player.x+Math.cos(a)*d,60,WORLD-60), y=clamp(player.y+Math.sin(a)*d,60,WORLD-60);
    police.push({x,y,angle:angTo(x,y,player.x,player.y),speed:0,color:'#1c3fd6',kind:'police',health:100,w:44,h:22,siren:rr(0,1)});
  }
}
function resetWorld(){
  rng=mulberry32(SEED);
  cars=[]; peds=[]; police=[]; parts=[]; pickups=[];
  spawnTraffic(26); spawnPeds(36);
  player.x=1600; player.y=1600; player.angle=-Math.PI/2; player.speed=0; player.onFoot=true; player.car=null; player.health=100; player.arrest=0;
  wanted=0; heat=0; missionIndex=0; mission=null; elapsed=0; cash=save.cash;
  debt=(typeof save.debt==='number'?save.debt:5000);
  startMission(0);
}
function startMission(i){
  missionIndex=i;
  const m=MISSIONS[i%MISSIONS.length];
  let mx,my;
  if(m.setup==='pickup'){ mx=600; my=600; }
  else if(m.setup==='getaway'){ mx=2600; my=600; }
  else { mx=600; my=2400; }
  // jitter the marker so repeat runs differ a little
  mx=clamp(mx+rr(-160,160),120,WORLD-120); my=clamp(my+rr(-160,160),120,Math.min(WORLD-120,2700));
  mission={def:m, x:mx, y:my, done:false};
  missionTimer=m.time;
  if(m.setup==='getaway'){ addWanted(2); spawnPolice(); }
  setObjective(m.name+' — '+m.text);
}
function setObjective(t){ const el=document.getElementById('objective'); if(el) el.textContent=t; }
let toastTimer=null;
function toast(t,ms){
  const el=document.getElementById('toast'); el.textContent=t; el.style.opacity=1;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ el.style.opacity=0; }, ms||2600);
}
function addWanted(n){
  heat=clamp(heat+n,0,6);
  const nw=Math.min(5,Math.ceil(heat));
  if(nw>wanted){ wanted=nw; save.bestStars=Math.max(save.bestStars,wanted); spawnPolice(); toast('WANTED LEVEL '+wanted+' ★','2200'); }
}
function addCash(n){
  cash+=n; save.cash=cash; persist();
  toast('+$'+n+'  •  Cash $'+cash, 2200); sfx('mission');
}
</script>
<script>
/* ---------- input ---------- */
const keys={};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if(e.repeat) return;
  keys[e.key.toLowerCase()]=true;
  audioInit();
  if(e.key.toLowerCase()==='m'){ muted=!muted; toast(muted?'Sound OFF':'Sound ON',1200); }
  if(e.key.toLowerCase()==='p'&&(state==='playing'||state==='paused')) togglePause();
  if(e.key.toLowerCase()==='r'&&state!=='title') startGame(mode);
  if(e.key.toLowerCase()==='e'&&state==='playing') tryEnterExit();
  if(e.key.toLowerCase()==='f'&&state==='playing'&&player.onFoot) punch();
  if(e.key.toLowerCase()==='h'&&state==='playing'&&!player.onFoot) sfx('horn');
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
function togglePause(){
  if(state==='playing'){ state='paused'; showScreen(pauseHTML()); }
  else if(state==='paused'){ state='playing'; hideScreen(); }
}
function tryEnterExit(){
  if(player.onFoot){
    let best=null,bd=70;
    for(const c of cars){ const d=dist(player.x,player.y,c.x,c.y); if(d<bd){bd=d;best=c;} }
    for(const c of police){ const d=dist(player.x,player.y,c.x,c.y); if(d<bd){bd=d;best=c;} }
    if(best){
      player.onFoot=false; player.car=best;
      if(best.kind==='traffic'||best.kind==='police'){ stats.stolen++; addWanted(1); toast('Car stolen! +1 ★',2000); }
      sfx('enter');
    }
  } else if(player.car){
    const c=player.car; player.onFoot=true; player.car=null;
    player.x=c.x+Math.cos(c.angle+Math.PI/2)*36; player.y=c.y+Math.sin(c.angle+Math.PI/2)*36;
    player.angle=c.angle; player.speed=0;
  }
}
function punch(){
  for(const p of peds){
    if(dist(player.x,player.y,p.x,p.y)<46){ p.panic=3; p.angle=angTo(p.x,p.y,player.x,player.y)+Math.PI; addWanted(0.5); burst(p.x,p.y,'#ffe66d',8); return; }
  }
  burst(player.x+Math.cos(player.angle)*26, player.y+Math.sin(player.angle)*26, '#ffffff', 4);
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++) parts.push({x,y,vx:rr(-90,90),vy:rr(-90,90),life:rr(0.3,0.7),color,size:rr(2,5)});
}

/* ---------- update ---------- */
function step(dt){
  elapsed+=dt;
  // wanted decay when quiet
  chaosTimer-=dt;
  if(chaosTimer<=0 && wanted>0){
    heat-=dt*(mode==='official'?0.08:0.16);
    const nw=Math.max(0,Math.ceil(heat));
    if(nw<wanted){ wanted=nw; }
    if(heat<=0){ wanted=0; heat=0; }
  }
  // player
  if(player.onFoot){
    let dx=0,dy=0;
    if(keys['w']||keys['arrowup'])dy-=1; if(keys['s']||keys['arrowdown'])dy+=1;
    if(keys['a']||keys['arrowleft'])dx-=1; if(keys['d']||keys['arrowright'])dx+=1;
    if(dx||dy){
      const l=Math.hypot(dx,dy); dx/=l; dy/=l;
      player.angle=Math.atan2(dy,dx);
      const nx=player.x+dx*190*dt, ny=player.y+dy*190*dt;
      if(!inBuilding(nx,player.y,14)) player.x=nx;
      if(!inBuilding(player.x,ny,14)) player.y=ny;
    }
    player.x=clamp(player.x,20,WORLD-20); player.y=clamp(player.y,20,WORLD-20);
    player.speed=0;
  } else if(player.car){
    const c=player.car;
    const fwd=(keys['w']||keys['arrowup'])?1:0, rev=(keys['s']||keys['arrowdown'])?1:0;
    const steer=((keys['a']||keys['arrowleft'])?-1:0)+((keys['d']||keys['arrowright'])?1:0);
    const drift=keys[' ']||false;
    const accel=fwd?260:rev?-180:0;
    c.speed=clamp(c.speed+accel*dt, -140, 330);
    if(!fwd&&!rev) c.speed*=Math.pow(0.4,dt);
    if(drift) c.speed*=Math.pow(0.55,dt);
    const grip=drift?2.1:3.4;
    c.angle+=steer*grip*dt*Math.sign(c.speed)*Math.min(1,Math.abs(c.speed)/120);
    const nx=c.x+Math.cos(c.angle)*c.speed*dt, ny=c.y+Math.sin(c.angle)*c.speed*dt;
    const b=inBuilding(nx,ny,20);
    if(b){
      c.speed*=-0.35; player.health=Math.max(0,player.health-6); sfx('crash'); shake=6;
      burst(c.x,c.y,'#ffb347',10); addWanted(0.25);
      if(player.health<=0){ wreckCar(c); }
    } else { c.x=nx; c.y=ny; }
    c.x=clamp(c.x,20,WORLD-20); c.y=clamp(c.y,20,WORLD-20);
    if(Math.abs(c.speed)>Math.abs(player.speed)) player.speed=c.speed;
    stats.topSpeed=Math.max(stats.topSpeed,Math.abs(c.speed)*0.9);
    if(Math.abs(c.speed)>20&&Math.random()<dt*8) parts.push({x:c.x-Math.cos(c.angle)*20,y:c.y-Math.sin(c.angle)*20,vx:rr(-20,20),vy:rr(-20,20),life:0.4,color:'#8888aa',size:3});
    player.x=c.x; player.y=c.y; player.angle=c.angle;
  }
  // traffic
  for(const c of cars){
    if(c===player.car) continue;
    c.x+=Math.cos(c.angle)*c.speed*dt; c.y+=Math.sin(c.angle)*c.speed*dt;
    // turn at intersections sometimes
    const nearRoad=Math.min(Math.abs(c.x-Math.round(c.x/ROAD)*ROAD), Math.abs(c.y-Math.round(c.y/ROAD)*ROAD));
    if(nearRoad<26 && rng()<dt*0.25) c.angle+=pick([-Math.PI/2,Math.PI/2]);
    if(c.x<40||c.x>WORLD-40||c.y<40||c.y>WORLD-40){ c.angle+=Math.PI; c.x=clamp(c.x,60,WORLD-60); c.y=clamp(c.y,60,WORLD-60); }
    // collision with player car (one hit per car per 1.5 s, so a traffic jam
    // cannot farm wanted stars or wreck a parked player)
    if(c.hitCd>0) c.hitCd-=dt;
    if(player.car&&c.hitCd<=0&&dist(c.x,c.y,player.car.x,player.car.y)<44){
      const d=angTo(c.x,c.y,player.car.x,player.car.y);
      c.x-=Math.cos(d)*30*dt*10; c.y-=Math.sin(d)*30*dt*10;
      // Only the player's fault when driving fast: being rear-ended while
      // slow costs a little health, but no wanted stars.
      const atFault=Math.abs(player.car.speed)>60;
      player.car.speed*=0.82; player.health=Math.max(0,player.health-(atFault?4:1)); sfx('crash'); shake=5;
      if(atFault){ addWanted(0.5); stats.hits++; }
      c.hitCd=1.5;
      if(player.health<=0) wreckCar(player.car);
    }
    // traffic slows and swerves around a stopped player car instead of piling in
    if(player.car&&dist(c.x,c.y,player.car.x,player.car.y)<90&&Math.abs(player.car.speed)<30){
      c.speed=Math.min(c.speed,40);
    }
    // hit pedestrian
    for(const p of peds){
      if(dist(c.x,c.y,p.x,p.y)<24){ p.panic=4; p.angle=angTo(p.x,p.y,c.x,c.y)+Math.PI; }
    }
  }
  // pedestrians
  for(const p of peds){
    if(p.panic>0){ p.panic-=dt; p.x+=Math.cos(p.angle)*120*dt; p.y+=Math.sin(p.angle)*120*dt; }
    else {
      if(dist(p.x,p.y,p.tx,p.ty)<12){ p.tx=p.x+rr(-160,160); p.ty=p.y+rr(-160,160); }
      p.angle=angTo(p.x,p.y,p.tx,p.ty);
      p.x+=Math.cos(p.angle)*p.speed*dt; p.y+=Math.sin(p.angle)*p.speed*dt;
    }
    p.x=clamp(p.x,20,WORLD-20); p.y=clamp(p.y,20,2750);
    if(inBuilding(p.x,p.y,6)){ p.x-=Math.cos(p.angle)*p.speed*dt*2; p.y-=Math.sin(p.angle)*p.speed*dt*2; }
    // player car hits ped
    if(player.car&&dist(p.x,p.y,player.x,player.y)<30){
      p.panic=4; addWanted(1); stats.hits++; sfx('crash'); shake=4;
      burst(p.x,p.y,'#ff5df2',10);
    }
    // player on foot bumps ped
    if(player.onFoot&&dist(p.x,p.y,player.x,player.y)<22){ p.panic=1.5; }
  }
  // police
  spawnTimer-=dt;
  if(wanted>0 && police.length<Math.min(5,wanted) && spawnTimer<=0){ spawnPolice(); spawnTimer=2; }
  for(let i=police.length-1;i>=0;i--){
    const c=police[i];
    const target=player.car?player.car:{x:player.x,y:player.y};
    const want=angTo(c.x,c.y,target.x,target.y);
    c.angle+=clamp(angDiff(c.angle,want),-2.6*dt,2.6*dt);
    const sp=200+wanted*28;
    c.speed=clamp(c.speed+220*dt,0,sp);
    c.x+=Math.cos(c.angle)*c.speed*dt; c.y+=Math.sin(c.angle)*c.speed*dt;
    if(inBuilding(c.x,c.y,20)){ c.speed*=-0.3; }
    const d=dist(c.x,c.y,player.x,player.y);
    if(d<40){
      if(player.car){
        player.car.speed*=0.9; player.health=Math.max(0,player.health-5); shake=5; sfx('crash');
        if(player.health<=0) wreckCar(player.car);
      } else {
        player.arrest+=dt;
        if(player.arrest>1.1){ endGame('busted'); return; }
      }
    } else if(player.onFoot) player.arrest=Math.max(0,player.arrest-dt);
    if(d>1100){ police.splice(i,1); }
  }
  if(wanted===0 && police.length>0 && rng()<dt*0.3) police.pop();
  // mission
  if(mission&&!mission.done){
    if(missionTimer>0){
      missionTimer-=dt;
      if(missionTimer<=0){ toast('Too slow! Mission failed — try again.',2600); startMission(missionIndex); }
    }
    if(dist(player.x,player.y,mission.x,mission.y)<56){
      mission.done=true;
      const reward=mission.def.reward;
      addCash(reward);
      save.missions++; debt=Math.max(0,debt-reward); save.debt=debt; persist();
      if(debt<=0 && missionIndex>=2){ endGame('win'); return; }
      toast('Mission complete! +$'+reward,2600);
      startMission((missionIndex+1)%MISSIONS.length);
    }
  }
  // particles
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0) parts.splice(i,1); }
  // camera
  camX+= (player.x-camX)*Math.min(1,dt*5);
  camY+= (player.y-camY)*Math.min(1,dt*5);
  if(shake>0) shake=Math.max(0,shake-dt*22);
  // audio
  if(AC&&!muted){
    if(engineGain) engineGain.gain.value=player.car?0.03+Math.abs(player.speed)/330*0.05:0;
    if(engineOsc) engineOsc.frequency.value=50+Math.abs(player.speed||0)*0.45;
    if(sirenGain) sirenGain.gain.value=wanted>=2?0.02:0;
    if(sirenOsc) sirenOsc.frequency.value=650+Math.sin(elapsed*6)*180;
  }
}
function wreckCar(c){
  burst(c.x,c.y,'#ff2d78',22); sfx('crash');
  const idx=cars.indexOf(c); if(idx>=0) cars.splice(idx,1);
  const pidx=police.indexOf(c); if(pidx>=0) police.splice(pidx,1);
  player.car=null; player.onFoot=true; player.health=100;
  player.x=c.x+40; player.y=c.y+40;
  toast('Car wrecked! You are on foot.',2600);
  if(wanted>=3){ /* keep wanted */ }
}
</script>
<script>
/* ---------- rendering ---------- */
const mm = document.getElementById('minimap').getContext('2d');
function drawCar(c, isPlayer){
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.angle);
  ctx.shadowColor = c.kind==='police' ? '#ff2222' : c.color;
  ctx.shadowBlur = isPlayer?16:8;
  ctx.fillStyle = '#000'; ctx.fillRect(-24,-13,48,26);
  ctx.shadowBlur = 0;
  ctx.fillStyle = c.color;
  roundRect(-22,-11,44,22,6); ctx.fill();
  ctx.fillStyle = 'rgba(180,230,255,.9)'; roundRect(-6,-10,14,20,3); ctx.fill();
  ctx.fillStyle = '#111'; ctx.fillRect(14,-9,5,18);
  ctx.fillStyle = '#ffe66d'; ctx.fillRect(20,-9,3,5); ctx.fillRect(20,4,3,5);
  ctx.fillStyle = '#ff2222'; ctx.fillRect(-23,-9,3,5); ctx.fillRect(-23,4,3,5);
  if(c.kind==='police'){
    ctx.fillStyle = (Math.floor(elapsed*6)%2===0)?'#ff2222':'#2244ff';
    ctx.fillRect(-8,-11,16,5);
    ctx.fillStyle = '#fff'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center';
    ctx.fillText('PD', 0, 2);
  }
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function render(){
  const sx = (Math.random()-0.5)*shake, sy = (Math.random()-0.5)*shake;
  const ox = clamp(camX-W/2, 0, WORLD-W), oy = clamp(camY-H/2, 0, WORLD-H);
  ctx.save(); ctx.translate(-ox+sx, -oy+sy);
  // sky/ground base
  ctx.fillStyle = '#0d0a24'; ctx.fillRect(ox-20, oy-20, W+40, H+40);
  // ocean (south)
  ctx.fillStyle = '#062a4d'; ctx.fillRect(ox-20, 2820, W+40, WORLD-2820+40);
  ctx.fillStyle = '#0a4a7a';
  for(let i=0;i<24;i++){ const wx=((i*137+elapsed*22)%WORLD); ctx.fillRect(wx, 2860+((i*53)%120), 90, 3); }
  ctx.fillStyle = '#e8c98a'; ctx.fillRect(ox-20, 2760, W+40, 60); // beach sand
  // city blocks (grass/concrete)
  ctx.fillStyle = '#14102e';
  for(let bx=0; bx<WORLD/ROAD; bx++) for(let by=0; by<WORLD/ROAD; by++){
    if(by*ROAD>2760) continue;
    ctx.fillRect(bx*ROAD+34, by*ROAD+34, ROAD-68, ROAD-68);
  }
  // roads
  ctx.fillStyle = '#1d1d2e';
  for(const r of ROADS){ ctx.fillRect(r-34, oy-20, 68, H+40); ctx.fillRect(ox-20, r-34, W+40, 68); }
  ctx.strokeStyle = 'rgba(255,214,64,.55)'; ctx.lineWidth = 2; ctx.setLineDash([18,18]);
  for(const r of ROADS){
    ctx.beginPath(); ctx.moveTo(r, oy-20); ctx.lineTo(r, oy+H+20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox-20, r); ctx.lineTo(ox+W+20, r); ctx.stroke();
  }
  ctx.setLineDash([]);
  // district labels
  ctx.font='bold 44px sans-serif'; ctx.textAlign='left'; ctx.fillStyle='rgba(255,255,255,.06)';
  for(const d of DISTRICTS) ctx.fillText(d.name, d.x+90, d.y+220);
  // palms
  for(const p of PALMS){
    ctx.strokeStyle='#2fae5f'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+4,p.y-14); ctx.stroke();
    ctx.fillStyle='#39d67a'; ctx.beginPath(); ctx.arc(p.x+4,p.y-16,8,0,7); ctx.fill();
  }
  // buildings with neon windows
  for(const b of BUILDINGS){
    ctx.fillStyle='#000'; ctx.fillRect(b.x+4,b.y+6,b.w,b.h);
    ctx.fillStyle=b.color; ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle=b.neon; ctx.globalAlpha=0.9; ctx.fillRect(b.x,b.y,b.w,4); ctx.globalAlpha=1;
    const r2=mulberry32(b.winSeed);
    ctx.fillStyle='rgba(255,230,120,.85)';
    for(let wy=b.y+12; wy<b.y+b.h-10; wy+=18)
      for(let wx=b.x+10; wx<b.x+b.w-10; wx+=16)
        if(r2()<0.4) ctx.fillRect(wx,wy,8,10);
  }
  for(const s of NEON_SIGNS){
    ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
    ctx.shadowColor=s.color; ctx.shadowBlur=12; ctx.fillStyle=s.color;
    ctx.fillText(s.text, s.x, s.y); ctx.shadowBlur=0;
  }
  // mission marker
  if(mission&&!mission.done){
    const pulse=1+Math.sin(elapsed*5)*0.15;
    ctx.save(); ctx.translate(mission.x, mission.y); ctx.scale(pulse,pulse);
    ctx.strokeStyle='#ffe66d'; ctx.lineWidth=4; ctx.shadowColor='#ffe66d'; ctx.shadowBlur=16;
    ctx.beginPath(); ctx.arc(0,0,30,0,7); ctx.stroke();
    ctx.fillStyle='#ffe66d'; ctx.beginPath(); ctx.moveTo(0,14); ctx.lineTo(-10,-6); ctx.lineTo(10,-6); ctx.closePath(); ctx.fill();
    ctx.restore(); ctx.shadowBlur=0;
    // off-screen arrow
    const dx=mission.x-player.x, dy=mission.y-player.y, d=Math.hypot(dx,dy);
    if(d>420){
      const ax=player.x+dx/d*300, ay=player.y+dy/d*300;
      ctx.save(); ctx.translate(ax,ay); ctx.rotate(Math.atan2(dy,dx));
      ctx.fillStyle='#ffe66d'; ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-8,-10); ctx.lineTo(-8,10); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  // pedestrians
  for(const p of peds){
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,6,0,7); ctx.fill();
    ctx.fillStyle='#ffd9b0'; ctx.beginPath(); ctx.arc(p.x,p.y-3,3.4,0,7); ctx.fill();
  }
  // cars
  for(const c of cars) drawCar(c, c===player.car);
  for(const c of police) drawCar(c, false);
  // player on foot
  if(player.onFoot){
    ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(player.angle);
    ctx.shadowColor='#7df9ff'; ctx.shadowBlur=10;
    ctx.fillStyle='#7df9ff'; ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='#12001f'; ctx.beginPath(); ctx.arc(4,0,4,0,7); ctx.fill();
    ctx.restore();
  }
  // particles
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life*2); ctx.fillStyle=p.color; ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); }
  ctx.globalAlpha=1;
  ctx.restore();
  // vignette / neon frame
  const g=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(10,2,30,.55)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  drawMinimap();
}
function drawMinimap(){
  mm.fillStyle='#0a0620'; mm.fillRect(0,0,180,180);
  const s=180/WORLD;
  mm.fillStyle='#2a2a44';
  for(const r of ROADS){ mm.fillRect(r*s-1,0,2,180); mm.fillRect(0,r*s-1,180,2); }
  mm.fillStyle='#0a4a7a'; mm.fillRect(0,2820*s,180,180-2820*s);
  if(mission&&!mission.done){ mm.fillStyle='#ffe66d'; mm.beginPath(); mm.arc(mission.x*s,mission.y*s,5,0,7); mm.fill(); }
  mm.fillStyle='#ff2222';
  for(const c of police){ mm.beginPath(); mm.arc(c.x*s,c.y*s,3,0,7); mm.fill(); }
  mm.fillStyle='#7df9ff'; mm.beginPath(); mm.arc(player.x*s,player.y*s,4,0,7); mm.fill();
  mm.strokeStyle='#fff'; mm.lineWidth=1.5; mm.beginPath(); mm.arc(player.x*s,player.y*s,6,0,7); mm.stroke();
}

/* ---------- HUD & screens ---------- */
const screenEl=document.getElementById('screen');
function showScreen(html){ screenEl.innerHTML=html; screenEl.classList.remove('hidden'); }
function hideScreen(){ screenEl.classList.add('hidden'); screenEl.innerHTML=''; }
function titleHTML(){
  const cont = save.cash>0||save.missions>0;
  return '<h1>NEON BAY</h1><h2>HEAT RISING</h2>'+
  '<p class="story">Maya Solis, getaway driver. You owe Kingfish $5,000 — and the whole city is watching. '+
  'Run his jobs, dodge the Neon Bay PD, and pay the debt before the heat burns you.</p>'+
  '<p style="margin-top:10px">Open-world driving • wanted stars • police chases • 3 story missions • minimap • save</p>'+
  '<div class="modes"><div class="mode sel" id="mA"><b>OFFICIAL</b>Strict police, slow heat decay</div>'+
  '<div class="mode" id="mB"><b>FAN EDITION</b>Relaxed police, faster decay</div></div>'+
  '<button class="btn" id="startBtn">'+(cont?'CONTINUE — $'+save.cash:'START ENGINE')+'</button>'+
  (cont?'<button class="btn ghost" id="newBtn">New game</button>':'')+
  '<div class="keys"><b>W A S D</b> drive / walk &nbsp; <b>E</b> enter / exit car &nbsp; <b>Space</b> handbrake &nbsp; '+
  '<b>F</b> punch &nbsp; <b>H</b> horn &nbsp; <b>P</b> pause &nbsp; <b>R</b> restart &nbsp; <b>M</b> sound</div>'+
  '<p style="margin-top:14px;font-size:12px;color:#8f88c9">Original game — no assets, names or music from any commercial game. All art drawn in code, all sound synthesized.</p>';
}
function pauseHTML(){
  return '<h1 id="big" style="font-size:44px">PAUSED</h1><p>Cash $'+cash+' • Missions done: '+save.missions+' • Top speed '+Math.round(stats.topSpeed)+' mph</p>'+
  '<button class="btn" onclick="resumeGame()">RESUME</button><button class="btn ghost" onclick="startGame(mode)">RESTART RUN</button>';
}
function endHTML(kind){
  if(kind==='win') return '<h1 id="big">DEBT PAID!</h1><p id="sub">Maya walks away clean. Neon Bay is yours — free roam continues.</p>'+
    '<p>Cash $'+cash+' • Missions completed: '+save.missions+'</p><button class="btn" onclick="resumeGame()">KEEP DRIVING</button>';
  if(kind==='busted') return '<h1 id="big" style="color:#7df9ff">BUSTED!</h1><p id="sub">The Neon Bay PD finally got you. The debt is still waiting…</p>'+
    '<p>Cash kept: $'+cash+'</p><button class="btn" onclick="startGame(mode)">TRY AGAIN</button>';
  return '<h1 id="big" style="color:#ff5df2">WRECKED!</h1><p>Cash kept: $'+cash+'</p><button class="btn" onclick="startGame(mode)">TRY AGAIN</button>';
}
function updateHUD(){
  document.getElementById('cash').textContent=cash;
  document.getElementById('debt').textContent=Math.max(0,debt);
  document.getElementById('speed').textContent=Math.round(Math.abs(player.speed||0));
  document.getElementById('vehState').textContent=player.onFoot?' · ON FOOT':(player.car&&player.car.kind==='police'?' · STOLEN PD CRUISER':' · DRIVING');
  const hf=document.getElementById('healthfill');
  hf.style.width=player.health+'%'; hf.style.background=player.health>50?'#39ff88':player.health>25?'#ffb347':'#ff2d78';
  let stars='';
  for(let i=1;i<=5;i++) stars+= i<=wanted?'★':'<span class="off">★</span>';
  document.getElementById('stars').innerHTML=stars;
  const mt=document.getElementById('missionTimer');
  mt.textContent=(mission&&missionTimer>0)?('⏱ '+Math.ceil(missionTimer)+'s — reach the marker!'):'';
}
function showHUD(v){
  for(const id of ['hudTop','hudRight','hudBottom']) document.getElementById(id).classList.toggle('hidden',!v);
}
</script>
<script>
/* ---------- game flow ---------- */
function startGame(m){
  mode=m||mode; audioInit();
  resetWorld();
  state='playing'; hideScreen(); showHUD(true);
  setObjective(MISSIONS[0].name+' — '+MISSIONS[0].text);
  toast('Neon Bay — pay the $'+debt+' debt. Good luck, Maya.', 3000);
}
function resumeGame(){ state='playing'; hideScreen(); }
function endGame(kind){
  state=kind; sfx('busted');
  if(kind==='win'){ showScreen(endHTML('win')); }
  else showScreen(endHTML(kind));
}
window.resumeGame=resumeGame; window.startGame=startGame;
screenEl.addEventListener('click',e=>{
  if(e.target.id==='startBtn'){ startGame(mode); }
  if(e.target.id==='newBtn'){ save={cash:0,missions:0,bestStars:0,debt:5000}; persist(); startGame(mode); }
  if(e.target.id==='mA'||e.target.closest&&e.target.closest('#mA')){ mode='official'; document.getElementById('mA').classList.add('sel'); document.getElementById('mB').classList.remove('sel'); }
  if(e.target.id==='mB'||e.target.closest&&e.target.closest('#mB')){ mode='fan'; document.getElementById('mB').classList.add('sel'); document.getElementById('mA').classList.remove('sel'); }
});

/* ---------- shot mode (real renders for screenshots) ---------- */
function applyShot(){
  if(SHOT==='start'){ resetWorld(); state='title'; showScreen(titleHTML()); showHUD(false); return; }
  if(SHOT==='play'){
    resetWorld(); state='playing'; hideScreen(); showHUD(true);
    // put Maya in a car mid-chase: 3 wanted stars, police closing in, mission live
    const c=cars[0]; player.onFoot=false; player.car=c; player.x=c.x; player.y=c.y;
    c.x=1600; c.y=1600; c.angle=-Math.PI/2; c.speed=180; player.x=1600; player.y=1600;
    camX=1600; camY=1600; addWanted(3); spawnPolice();
    for(let i=0;i<40;i++) step(1/60); // let traffic/police settle into a lively frame
    return;
  }
  if(SHOT==='end'){
    resetWorld(); cash=5000; save.cash=5000; debt=0;
    state='win'; showScreen(endHTML('win')); showHUD(false); return;
  }
}

/* ---------- main loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='playing'){ step(dt); updateHUD(); }
  render();
  requestAnimationFrame(loop);
}
/* Debug hook for local playtesting (harmless in production). */
window.__neonbay = { startGame, endGame, get state(){ return state; }, player,
  get wanted(){ return wanted; }, get cash(){ return cash; }, get debt(){ return debt; },
  get mission(){ return mission; }, step, get cars(){ return cars; }, get peds(){ return peds; }, get police(){ return police; } };

if(SHOT){ applyShot(); }
else { resetWorld(); state='title'; showScreen(titleHTML()); showHUD(false); }
requestAnimationFrame(loop);
</script>
